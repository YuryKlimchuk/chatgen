version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: chatgen-postgres
    environment:
      POSTGRES_USER: user-pg
      POSTGRES_PASSWORD: pwd-pg
      POSTGRES_DB: chatgen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: chatgen-minio
    environment:
      MINIO_ROOT_USER: minio-access
      MINIO_ROOT_PASSWORD: minio-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
